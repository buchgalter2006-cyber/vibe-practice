<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Агент расходов · Ф7</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#12141a;--muted:#6b7280;--line:#e6e8ec;
        --accent:#3f5bd9;--good:#0f9d58;--bad:#d93025}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:760px;margin:36px auto;padding:0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,21,33,.05),0 6px 18px rgba(16,21,33,.05)}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  textarea{width:100%;min-height:84px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;resize:vertical}
  button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:11px 22px;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.6;cursor:default}
  .badge{display:inline-block;font-size:12px;border-radius:7px;padding:2px 9px;font-weight:600}
  .ok{color:#0b7a43;background:#e7f6ee}.warn{color:#b25e09;background:#fdf1e2}.err{color:#8a2c25;background:#fdeceb}
  .tx{border-top:1px solid #f0f1f4;padding-top:10px;margin-top:10px}
  .tx b{font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
  th{color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
  td{padding:6px 8px;border-bottom:1px solid #f0f1f4}
  .muted{color:var(--muted)}
  #status{margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Агент расходов</h1>
    <div class="sub">сообщение → разбор → строка в Google-таблице · правило «не угадывать» · движок: <span id="engine">…</span></div>
    <textarea id="text" placeholder="Например: «Оплатили Яндекс Директу 82 000 картой» или «исправь сумму: не 82 000, а 89 000»"></textarea>
    <button id="send">Отправить агенту</button>
    <div id="status"></div>
    <div id="answer"></div>
  </div>
  <div class="card">
    <h2 style="font-size:15px;margin:0">Последние записи</h2>
    <div id="recent" class="muted">загрузка…</div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? "").replace(/</g,"&lt;"); }
function fmt(n){ return n == null ? "—" : Math.round(n).toLocaleString("ru-RU") + " ₽"; }

async function loadEngine(){ try{ const r = await fetch("/api/engine"); const d = await r.json();
  $("#engine").textContent = d.mode === "llm" ? "LLM (DeepSeek/RouterAI)" : "офлайн-правила (без ключа)"; }catch(e){ $("#engine").textContent = "недоступен"; } }

async function loadRecent(){ const r = await fetch("/api/recent"); const d = await r.json();
  if(!d.rows || !d.rows.length){ $("#recent").textContent = "пока нет записей"; return; }
  const head = d.rows[0];
  const body = d.rows.slice(1).reverse();
  $("#recent").innerHTML = "<table><thead><tr>" + head.slice(0,10).map(h=>"<th>"+esc(h)+"</th>").join("") + "</tr></thead><tbody>" +
    body.map(r => "<tr>" + head.slice(0,10).map((h,i)=>{
      let v = r[i];
      if(head[i]==="Сумма") v = fmt(parseFloat(String(v).replace(",",".")));
      if(head[i]==="Статус") v = '<span class="badge '+(String(v).includes("провер")?"warn":"ok")+'">'+esc(v)+"</span>";
      return "<td>"+ (v==null?"":v) +"</td>";}).join("") + "</tr>").join("") + "</tbody></table>"; }

$("#send").addEventListener("click", async () => {
  const text = $("#text").value.trim();
  if(!text) return;
  $("#send").disabled = true;
  $("#status").innerHTML = '<span class="muted">агент думает…</span>';
  $("#answer").innerHTML = "";
  try{
    const r = await fetch("/api/message", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text})});
    const d = await r.json();
    if(d.error){ $("#status").innerHTML = '<span class="badge err">ошибка</span> ' + esc(d.error); }
    else if(d.result.action === "expense"){
      const parts = d.written.map(w => {
        const t = w.tx, warn = t.status !== "готово";
        return '<div class="tx"><b>' + fmt(t.amount) + '</b> · ' + esc(t.article) + ' · ' + esc(t.payment_method) +
          ' · <span class="badge '+(warn?"warn":"ok")+'">'+esc(t.status)+'</span>' +
          ' <span class="muted">→ строка '+w.row+' таблицы</span>' +
          (t.comment ? '<div class="muted" style="margin-top:4px">'+esc(t.comment)+'</div>' : "") + "</div>";
      }).join("");
      $("#status").innerHTML = '<span class="badge ok">записано: '+d.written.length+'</span>';
      $("#answer").innerHTML = parts;
      loadRecent();
    } else if(d.result.action === "correct"){
      $("#status").innerHTML = '<span class="badge ok">исправлено</span> строка '+d.corrected.row+
        ' · поля: '+esc(Object.keys(d.corrected.fields).join(", "));
      loadRecent();
    } else {
      $("#status").innerHTML = '<span class="badge warn">проигнорировано</span> ' + esc(d.result.comment||"");
    }
  }catch(e){ $("#status").innerHTML = '<span class="badge err">агент недоступен</span>'; }
  $("#send").disabled = false;
});
loadEngine(); loadRecent();
</script>
</body>
</html>
